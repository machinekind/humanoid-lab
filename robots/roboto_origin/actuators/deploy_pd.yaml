# Deployable PD preset: verbatim from the upstream Isaac ArticulationCfg
# (modules/roboparty_train/robolab/robolab/assets/robots/roboparty.py,
# BSD-3-Clause, at PROVENANCE.md's pinned commit -- not vendored into
# source/, cited here only). These are the gains RoboParty runs on
# hardware, one-to-one per joint group.
#
# model: pd.
#
# soft_limit_factor: 0.9, matching upstream's soft_joint_pos_limit_factor
#   0.90.
#
# action_scale_rad: 0.25, upstream's scheme verbatim: a flat 0.25 rad
#   action scale on every joint (RobotCfg.action_scale). It replaces the
#   factor*effort/kp formula, so the upstream action-rate weights price
#   the same quantity here.
#
# armature: 0.01 for every group. This is upstream's flat placeholder
#   value, not a measured reflected inertia -- upstream publishes no
#   per-joint armature table (contrast asimov_v1's ENCOS-derived values).
#   Kept as-is rather than invented.
#
# Not modeled: upstream drives these joints through DelayedPDActuatorCfg,
#   simulating a 0-2 step actuation delay. This repo's `delayed` actuator
#   model is registered but raises NotImplementedError (presets.py), so the
#   delay is not modeled here.
#
# The sizing preset for this robot is actuators/sizing_ideal.yaml; its
#   DM-J10010L armature row is PROVISIONAL (see that file's header).

model: pd
soft_limit_factor: 0.9
action_scale_rad: 0.25

groups:
  thigh_yaw:
    kp: 100.0
    kd: 3.3
    effort_limit: 120.0
    velocity_limit: 25.0
    armature: 0.01
  thigh_roll:
    kp: 100.0
    kd: 3.3
    effort_limit: 120.0
    velocity_limit: 25.0
    armature: 0.01
  thigh_pitch:
