[project]
name = "humanoid-lab"
version = "0.1.0"
description = "Locomotion training for open-source humanoids: MJX + Brax PPO"
requires-python = ">=3.11,<3.13"
dependencies = [
    # jax 0.9.2 is the proven pin for this driver family; cuda extra only on linux
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform == 'darwin'",
    # One vendored unit: mujoco-mjx 3.10.0 vendors the MJWarp that needs
    # exactly warp-lang 1.13.0. A floating mujoco resolve on a fresh venv
    # pulled a newer mjx whose MJWarp stubbed out against warp 1.13 and
    # broke put_model(impl="warp") (cluster gate probes, 2026-08-02).
    "mujoco==3.10.0",
    "mujoco-mjx==3.10.0",
    "warp-lang==1.13.0",
    "brax>=0.12.1",
    "playground>=0.0.4",
    "ml-collections>=0.1.1",
    "wandb>=0.23.0",
    "loguru>=0.7.3",
    "tqdm",
    "numpy",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "mediapy",
    "hydra-core>=1.3.4",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanoid_lab"]
