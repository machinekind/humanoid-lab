name: joystick

env:
  # robot.yaml keyframe used for reset qpos and the PD default_pose anchor
  # (see envs/base.py). Validated to exist in the model at construct time.
  reset_keyframe: "home"

  # Reset pose noise: uniform +-reset_noise (rad) added to
  # every actuated joint's qpos at reset. 0.0 disables it.
  reset_noise: 0.05

  # Observations, in order. state = actor (only signals a real robot has:
  # IMU + joint encoders + own action/command history + the env's own gait
  # clock), privileged = critic (sim-only extras allowed). Catalog: gyro,
  # gravity, joint_pos, joint_vel, last_action, linvel, height,
  # actuator_force, contacts, command, phase.
  obs:
    state:
      - gyro
      - gravity
      - joint_pos
      - joint_vel
      - last_action
      - command
      - phase
    privileged:
      - gyro
      - gravity
      - joint_pos
      - joint_vel
      - last_action
      - command
      - phase
      - linvel
      - height
      - contacts
      - actuator_force

  # Command envelope: generic humanoid defaults, sampled by _sample_command.
  # Each robot pins its own in configs/robot/<name>.yaml (an @package
  # _global_ overlay composed after this task config -- see
  # configs/config.yaml's defaults comment). configs/robot/asimov_v1.yaml is
  # the worked example.
  command:
    vx: [-0.8, 0.8]
    vy: [-0.6, 0.6]
    wz: [-0.6, 0.6]

  # Actor observation noise, by component name (unlisted components default
  # noise-free). Generic humanoid defaults; each robot pins its own in
  # configs/robot/<name>.yaml (see configs/robot/asimov_v1.yaml for the
  # overlay pattern).
  obs_noise:
    gyro: 0.01
    joint_pos: 0.01
    joint_vel: 0.1

  # asimov stands ~0.72-0.75 m. robot.yaml's home keyframe base_pos z
  # (0.636 m) is not this: it's the floating-base placeholder measured so
  # the feet just touch the floor, not the robot's standing height.
  # max_tilt_gz is an untuned starting point.
  fall:
    min_height: 0.45
    max_tilt_gz: -0.4

ppo: {}
