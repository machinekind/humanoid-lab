# @package _global_
# Diagnostic arm for the asimov flat-curve hypothesis (2026-07 HPC A/B):
# the generic joystick penalties swamp tracking (per-step reward is net
# negative while asimov dies at ~1 s, so early termination maximizes
# reward). This experiment cuts the four dominant penalties to the levels
# roboto_origin learned under, changing nothing else. It is NOT asimov
# tuning: if this arm wins, port the real weights from asimov-mjlab the
# way roboto's were ported from RoboParty.
#
# robot/task/actuators are pinned so this file is the complete record of
# the arm: both A/B arms ran asimov_v1 + joystick + sizing_ideal, and a
# run with a different robot would compose that robot's own reward
# overlay under these four keys, which is neither arm.
defaults:
  - override /robot: asimov_v1
  - override /task: joystick
  - override /actuators: sizing_ideal

task:
  env:
    reward:
      scales:
        orientation: -1.0
        lin_vel_z: -0.2
        action_rate: -0.02
        action_accel: -0.02
