# @package _global_
# roboto_walk_v5: roboto_origin run 5, the style package -- CUT after the
# gate-1 FAIL (job job-11: the full four-change package collapsed into
# stand-under-command by 3e8; zero swings in every battery scenario). The
# pre-committed cut in docs/plans/roboto-first-run.md applies: knee_stance
# and the clock change are dropped, gait_symmetry and the energy triple
# stay. Gate-1 taught that knee_stance (tol 0.15 rad) taxes the loading-
# response flexion walking needs, so it priced the gait itself; and a
# policy that never steps never arms gait_symmetry, so standing pays no
# symmetry charge either -- the stand basin was the package's optimum.
# What stays, against v4's signal:
#   - gait_symmetry -2.0 (new term): the limp signature priced directly,
#     as the relative left-right difference of the completed swing/stance
#     duration EMAs; arms only once both feet have stepped.
#   - energy -3e-4 (x3 the ported upstream weight): smoother motion.
# PPO sizing stays in the submit line (NUM_ENVS=4096 BATCH=128, one GPU),
# the run-4 default. DR switches and PPO knobs are unchanged from v4.
defaults:
  - override /robot: roboto_origin
  - override /task: joystick
  - override /actuators: deploy_pd
  - override /network: large

domain_rand: true

dr:
  joint_gains: { enable: true }
  com_offset: { enable: true }
  dof: { enable: true }
  foot_friction: { enable: true }
  base_mass_add: { enable: true }
  # Decouple forcerange from the gain draw with a no-op range: upstream
  # does not randomize effort limits.
  motor_strength: { enable: true, range: [1.0, 1.0] }

task:
  env:
    reward:
      scales:
        gait_symmetry: -2.0
        energy: -3.0e-4

# RSL-RL BaseAgentCfg values (rpo_agent_cfg.py). Fixed LR: brax has no
# adaptive-KL schedule. Budget: 4096 envs x 24 steps x 12000 iterations,
# ~1.2e9 env steps. num_envs and batch come from jobs/train.sh.
ppo:
  discounting: 0.994
  gae_lambda: 0.9
  entropy_cost: 0.005
  learning_rate: 1.0e-4
  num_timesteps: 1.2e9
