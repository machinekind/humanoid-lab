# @package _global_
# roboto_walk_v5: roboto_origin run 5, the style package. Run 4b showed the
# v4 signal is the binding constraint, not the budget: the curve sat flat
# through a whole second 1.2e9 while battery inched (docs/plans/
# roboto-first-run.md, run 4b verdict). Four coordinated changes against
# v4's reward, all aimed at how the walk looks:
#   - knee_stance -2.0 (tol 0.15 rad): the stance leg carries the body
#     straighter than the home keyframe's 0.3 rad crouch.
#   - gait_symmetry -2.0: the limp signature (walk_ramp antiphase 0.740 vs
#     0.90+ on turn/spin) priced directly, as the relative left-right
#     difference of the completed swing/stance duration EMAs.
#   - gait.freq 0.9-1.4 Hz (from 1.0-2.0): the clock is the cadence
#     generator, so lowering it buys longer strides instead of a shuffle.
#     biped_air_time_threshold rises 0.4 -> 0.5 s so the longer swings the
#     slower clock asks for (up to ~0.55 s at duty 0.5) stay paid.
#   - energy -3e-4 (x3 the ported upstream weight): smoother,
#     pendulum-leaning motion.
# PPO sizing stays in the submit line (NUM_ENVS=4096 BATCH=128, one GPU),
# the run-4 default. DR switches and PPO knobs are unchanged from v4.
defaults:
  - override /robot: roboto_origin
  - override /task: joystick
  - override /actuators: deploy_pd
  - override /network: large

domain_rand: true

dr:
  joint_gains: { enable: true }
  com_offset: { enable: true }
  dof: { enable: true }
  foot_friction: { enable: true }
  base_mass_add: { enable: true }
  # Decouple forcerange from the gain draw with a no-op range: upstream
  # does not randomize effort limits.
  motor_strength: { enable: true, range: [1.0, 1.0] }

task:
  env:
    gait:
      freq: [0.9, 1.4]
    reward:
      biped_air_time_threshold: 0.5
      scales:
        knee_stance: -2.0
        gait_symmetry: -2.0
        energy: -3.0e-4

# RSL-RL BaseAgentCfg values (rpo_agent_cfg.py). Fixed LR: brax has no
# adaptive-KL schedule. Budget: 4096 envs x 24 steps x 12000 iterations,
# ~1.2e9 env steps. num_envs and batch come from jobs/train.sh.
ppo:
  discounting: 0.994
  gae_lambda: 0.9
  entropy_cost: 0.005
  learning_rate: 1.0e-4
  num_timesteps: 1.2e9
