# @package _global_
# yolo_income_long plus the smoothness package, warm-started from a walker
# that already carries the income: action_rate and action_accel -0.05 (the
# roboto_origin overlay ports -0.02), torque_rate -3.0e-4 (overlay 0),
# joint_acc -7.5e-7 (overlay -2.5e-7), and stand_still_vel_weight 0.5
# (default 0.2), the one stand-specific damping lever. Tests whether
# heavier smoothness penalties lower standing vibration without giving up
# the gait. At the behaviour of a walking policy these terms pay, per
# episode: action_rate -1.78 (-0.71 at -0.02), action_accel -4.52 (-1.81),
# joint_acc -1.44 (-0.48), torque_rate -1.97.
# restore=<checkpoint dir> comes from the command line (jobs/train_chain.sh).
defaults:
  - override /robot: roboto_origin
  - override /task: joystick
  - override /actuators: deploy_pd
  - override /network: large

domain_rand: true

dr:
  joint_gains: { enable: true }
  com_offset: { enable: true }
  dof: { enable: true }
  foot_friction: { enable: true }
  base_mass_add: { enable: true }
  # Decouple forcerange from the gain draw with a no-op range: upstream
  # does not randomize effort limits.
  motor_strength: { enable: true, range: [1.0, 1.0] }

task:
  env:
    reward:
      # Velocity-damping share of stand_still (position share is 1).
      stand_still_vel_weight: 0.5
      scales:
        gait_symmetry_income: 0.5
        energy: -3.0e-4
        feet_apex: 10.0
        action_rate: -0.05
        action_accel: -0.05
        torque_rate: -3.0e-4
        joint_acc: -7.5e-7

# RSL-RL BaseAgentCfg values (rpo_agent_cfg.py). Fixed LR: brax has no
# adaptive-KL schedule. num_envs and batch come from jobs/train.sh.
# num_evals sets the checkpoint cadence: brax saves one after each of the
# num_evals-1 training epochs (none at step 0), so a run that dies loses at
# most 1/23 of its budget. jobs/train.sh's
# RUN_ARGS="++ppo.num_timesteps=..." overrides the budget.
ppo:
  discounting: 0.994
  gae_lambda: 0.9
  entropy_cost: 0.005
  learning_rate: 1.0e-4
  num_timesteps: 1.0e9
  num_evals: 24
