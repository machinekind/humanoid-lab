# @package _global_
# Phase B, warm-started from a yolo_v4 checkpoint that already walks: the
# symmetry income, x3 energy, and feet_apex doubled to 10.0 over a 1.5e9
# budget. Tests whether a doubled foot-lift weight raises swing apex toward
# reward.apex_target (0.08) on a policy that already steps. feet_apex pays
# clip(apex/0.08, 0, 1) once per landing: at the behaviour of a walking
# policy with a 2.9 cm apex this term pays +4.1/episode at 10.0 (+2.0 at
# 5.0), up to +11 at the target. apex_target stays 0.08: the term clips at
# the target, so a higher target would lower the pay per centimetre.
# restore=<checkpoint dir> comes from the command line (jobs/train_chain.sh).
defaults:
  - override /robot: roboto_origin
  - override /task: joystick
  - override /actuators: deploy_pd
  - override /network: large

domain_rand: true

dr:
  joint_gains: { enable: true }
  com_offset: { enable: true }
  dof: { enable: true }
  foot_friction: { enable: true }
  base_mass_add: { enable: true }
  # Decouple forcerange from the gain draw with a no-op range: upstream
  # does not randomize effort limits.
  motor_strength: { enable: true, range: [1.0, 1.0] }

task:
  env:
    reward:
      scales:
        gait_symmetry_income: 0.5
        energy: -3.0e-4
        feet_apex: 10.0

# RSL-RL BaseAgentCfg values (rpo_agent_cfg.py). Fixed LR: brax has no
# adaptive-KL schedule. num_envs and batch come from jobs/train.sh.
# num_evals sets the checkpoint cadence: brax saves one after each of the
# num_evals-1 training epochs (none at step 0), so a run that dies loses at
# most 1/23 of its budget. jobs/train.sh's
# RUN_ARGS="++ppo.num_timesteps=..." overrides the budget.
ppo:
  discounting: 0.994
  gae_lambda: 0.9
  entropy_cost: 0.005
  learning_rate: 1.0e-4
  num_timesteps: 1.5e9
  num_evals: 24
