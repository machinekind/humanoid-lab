# @package _global_
# roboto_walk_v1: the first proper roboto_origin run. Recipe and deltas:
# docs/plans/roboto-first-run.md. The robot overlay pins the reward
# weights, push schedule, and DR ranges. This file arms the DR switches
# and sets the PPO knobs brax has.
defaults:
  - override /robot: roboto_origin
  - override /task: joystick
  - override /actuators: deploy_pd
  - override /network: large

domain_rand: true

dr:
  joint_gains: { enable: true }
  com_offset: { enable: true }
  dof: { enable: true }
  foot_friction: { enable: true }
  base_mass_add: { enable: true }
  # Decouple forcerange from the gain draw with a no-op range: upstream
  # does not randomize effort limits.
  motor_strength: { enable: true, range: [1.0, 1.0] }

# RSL-RL BaseAgentCfg values (rpo_agent_cfg.py). Fixed LR: brax has no
# adaptive-KL schedule. Budget: 4096 envs x 24 steps x 12000 iterations,
# ~1.2e9 env steps. num_envs and batch come from jobs/train.sh.
ppo:
  discounting: 0.994
  gae_lambda: 0.9
  entropy_cost: 0.005
  learning_rate: 1.0e-4
  num_timesteps: 1.2e9
