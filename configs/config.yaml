# Robot configs (configs/robot/*.yaml) are `@package _global_` overlays: a
# robot yaml carries its own `task:`/`dr:` sections that patch the task/dr
# bases loaded earlier in this list. Composing `robot` after `task`/`dr`
# lets a robot pin robot-specific keys (reward weights, DR ranges,
# obs-noise scales, command envelopes) over the task/dr defaults. CLI
# overrides win over everything here, robot overlays included: Hydra
# applies them after the whole defaults list composes. `_self_` placement
# only governs where this file's own keys merge relative to the groups.
# Probe-verified on this repo: overlay wins over the task/dr base, CLI
# wins over the overlay.
#
# Experiments (configs/experiment/*.yaml) are also `@package _global_`
# overlays, selected with `experiment=<name>` (no `+`, since the group has
# a real entry below: `null`). The `experiment` group is composed last, so
# an experiment overlay wins over this file's own keys (`_self_`) as well
# as over robot/task/dr, letting an experiment override run_name, ppo,
# wandb, or domain_rand alongside the usual robot/task/actuators overrides.
# Full wins order, weakest to strongest: task/dr base < robot overlay <
# this file's own keys (`_self_`) < experiment overlay < CLI.
defaults:
  - task: joystick
  - actuators: sizing_ideal
  - network: default
  - dr: default
  - robot: asimov_v1
  - _self_
  - experiment: null

run_name: null # default: <task>_<timestamp>
seed: 0
smoke: false # tiny CPU-sized run for a pipeline check
restore: null # checkpoint dir to warm-start from
domain_rand: false

# Deep-merged onto the loaded actuator preset yaml at env/model construction
# (robot/presets.py's load_actuator_preset -- the one choke point every
# consumer routes through). Experiment yamls set keys here directly; from
# the CLI use +actuators.overrides.groups.<group>.<param>=<value>. This
# dict-merges with the `actuators` group's own `name:` key since `_self_`
# composes after the `actuators` group (see the defaults comment above).
actuators:
  overrides: {}

# Ends a run whose eval reward has plateaued. Brax checkpoints at every
# eval, so the newest checkpoint is the early-stopped policy and nothing is
# lost by stopping. Calibrate min_delta ABOVE the eval noise before trusting
# this: w01-tek's eval noise was +-1.5 reward, so min_delta=0.5 let noise
# reset the patience clock and they raised it to 1.0 (and patience to 8 for
# overnight runs). Measure our own eval noise -- repeat evals of one
# checkpoint -- before enabling.
early_stop:
  enable: false
  min_evals: 10 # no verdict before this many evals, however flat they are
  patience: 6 # consecutive evals with no new best that end the run
  min_delta: 0.5 # a new best must beat the running best by MORE than this

wandb:
  enable: true
  project: humanoid-lab
  group: null # null: defaults to the selected experiment name (see train.py); no group when no experiment is selected

# Free-form overrides applied onto the tuned playground Go1 PPO config,
# after the task's own ppo block (so CLI ppo.foo=... wins).
ppo: {}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
