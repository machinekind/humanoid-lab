# MAB Robotics (Poznan, mabrobotics.pl) MA-series actuator survey, from
# PLAN.md's "MAB Robotics actuator survey (2026-07-14)". Integrated
# actuators: brushless motor + planetary/harmonic reducer + MD-series
# controller with an absolute encoder, one housing, CAN-FD/CANopen at
# 12-48 VDC (60 V option). Prices are single-unit list prices from the
# shop; PLAN.md notes the shop states volume pricing is significantly
# lower. Customization is offered on all models.
#
# max_speed_rad_s is computed from the published RPM (rad/s = rpm * pi/30)
# for every row -- PLAN.md itself gives both units for 4 of the 7 rows
# (MA-p-100-30, both MA-p-100-IP66 variants, MA-p-45-36); the conversion
# formula reproduces those published rad/s figures exactly (e.g. 96 RPM ->
# 10.1 rad/s), so the same formula is used here to fill in rad/s for the
# MA-p-80-IP66 variants and MA-H, which PLAN.md gives in RPM only.
#
# No J_rotor/armature field: see caveats.no_j_rotor below -- MAB publishes
# no rotor inertia, so armature cannot be computed for any of these yet.

MA-p-100-30:
  torque_rated_nm: 50
  torque_peak_nm: 150
  max_speed_rpm: 96
  max_speed_rad_s: 10.1
  gear: {ratio: 30, type: planetary}
  mass_kg: 1.1
  price_eur_list: 898
  url: https://www.mabrobotics.pl/product-page/ak10-30-cubemars-t-motor

