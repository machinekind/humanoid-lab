# Open gaps before a mab.yaml-backed actuator preset can be written
# (PLAN.md "Open gaps before a `mab.yaml` preset can be written"). Carried
# here verbatim in spirit so nobody re-derives them from the shop pages.
caveats:
  no_j_rotor: >
    MAB publishes no rotor inertia, so armature cannot be computed from the
    shop specs. Ask MAB for J_rotor, or identify it on the bench with the
    fbb MD/mdtool setup. Lead: the MA-p-100-30 product URL slug is
    "ak10-30-cubemars-t-motor", so the base motor is likely a CubeMars AK10
    and its rotor inertia may be in CubeMars datasheets. MAB also resells
    CubeMars actuators directly (shop category "Cubemars Actuators").
  no_torque_speed_curves: >
    MAB publishes no torque-speed curves, only the peak-torque and
    max-speed points. The DC-motor model needs the corner speed. Ask or
    measure.
  ma_h_needs_quote: >
    MA-H specs are given as ranges across sizes. Per-size numbers require
    a quote.

# Joint mapping against the ENCOS anchor (PLAN.md "Joint mapping against
# the ENCOS anchor"), with the margin comments carried verbatim in spirit.
joint_mapping:
  hip_pitch_and_knee: >
    MA-p-100-30 covers both (150 Nm peak vs 120/70 needed; 10.1 rad/s vs
    the ~7.4 rad/s demand peak in the mockup, though below the ENCOS
    12.6 rad/s spec).
  hip_roll: >
    MA-p-100-30, or an MA-H size 25/32 if the harmonic-drive properties
    matter.
  hip_yaw: >
    MA-p-100-IP66 KV60 (48 Nm peak vs 60 spec, but the demand estimate is
    ~12 Nm).
  ankle: >
    2x MA-p-45-36 in the parallel-ankle arrangement, ~48 Nm combined peak
    in pitch. A single unit is marginal against the ~22 Nm P99 estimate.
